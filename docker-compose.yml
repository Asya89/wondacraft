services:
  postgres:
    image: postgres:16-alpine
    container_name: wondacraft-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: wondacraft
      POSTGRES_PASSWORD: wondacraft
      POSTGRES_DB: wondacraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wondacraft -d wondacraft']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
